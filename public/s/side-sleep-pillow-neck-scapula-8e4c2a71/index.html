<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f7f4ee">
<title>横向き寝の高さを選び、左の首〜肩をゆるめる</title>
<style>
:root{--paper:#f7f4ee;--panel:#fffdf8;--ink:#2e2a25;--muted:#766d63;--line:#ded5c9}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 8% 0%,rgba(201,138,61,.15),transparent 28rem),var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;line-height:1.75}button{font:inherit}.page{width:min(100%,820px);margin:0 auto;padding:28px 15px 48px}.hero{text-align:center;margin-bottom:20px}.label{display:inline-block;padding:6px 16px;margin-bottom:12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:.72rem;font-weight:850;letter-spacing:.12em}h1{margin:0 0 10px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(1.7rem,6vw,2.7rem);line-height:1.35}.lead{max-width:650px;margin:0 auto;color:var(--muted);font-size:.9rem}.note,.footer{margin:18px 0;padding:15px 16px;background:rgba(255,253,248,.9);border:1px solid var(--line);border-radius:16px}.note p,.footer p{margin:0;color:#5e574f;font-size:.84rem}.cards{display:grid;gap:13px}.section-title{margin:13px 3px 0;padding:7px 12px;border-left:5px solid #c98a3d;color:#4f463d;font-size:.9rem;font-weight:900;letter-spacing:.08em}.section-title:first-child{margin-top:0}.card{--color:#c98a3d;display:block;width:100%;padding:0;text-align:left;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:19px;box-shadow:0 8px 22px rgba(65,49,32,.06);overflow:hidden;cursor:pointer}.card-head{display:grid;grid-template-columns:48px 1fr 24px;gap:11px;align-items:center;padding:14px}.mark{display:grid;width:46px;height:46px;place-items:center;border-radius:14px;color:var(--color);background:color-mix(in srgb,var(--color) 14%,white);font-weight:900}.tag{display:inline-block;margin-bottom:3px;color:var(--color);font-size:.66rem;font-weight:900;letter-spacing:.08em}.card h2{margin:0;font-size:1rem;line-height:1.45}.arrow{color:var(--color);text-align:center;transition:transform .18s}.card[aria-expanded="true"] .arrow{transform:rotate(180deg)}.card-body{display:none;padding:0 16px 17px 73px}.card[aria-expanded="true"] .card-body{display:block}.summary{margin:0 0 13px;color:var(--muted);font-size:.86rem}.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:14px}.chip{padding:5px 8px;border:1px solid color-mix(in srgb,var(--color) 35%,var(--line));border-radius:999px;background:#fff;font-size:.72rem;font-weight:800}.flow-arrow{color:var(--color);font-weight:900}.points{display:grid;gap:9px}.point{display:grid;grid-template-columns:24px 1fr;gap:9px}.num{display:grid;width:24px;height:24px;place-items:center;border-radius:50%;color:var(--color);background:color-mix(in srgb,var(--color) 14%,white);font-size:.72rem;font-weight:900}.point p{margin:0;font-size:.87rem}.tip{display:block;margin-top:14px;padding:12px 13px;border-left:4px solid var(--color);border-radius:12px;background:color-mix(in srgb,var(--color) 8%,white)}.tip strong{display:block;color:var(--color);font-size:.76rem}.tip p{margin:3px 0 0;font-size:.82rem}.footer strong{color:#4f463d}@media(max-width:540px){.card-body{padding:0 14px 16px}.card-head{grid-template-columns:43px 1fr 22px}.mark{width:41px;height:41px}}@media(prefers-reduced-motion:reduce){.arrow{transition:none}}
.resources{margin:18px 0;padding:16px;background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:16px}.resources h2{margin:0 0 10px;font-size:.92rem}.resource-links{display:flex;flex-wrap:wrap;gap:9px}.resource-link{display:inline-flex;align-items:center;padding:9px 13px;border-radius:999px;background:#c98a3d;color:#fff;font-size:.8rem;font-weight:850;text-decoration:none}.resource-link::after{margin-left:7px;content:"↗"}@media(max-width:540px){.resource-links{display:grid}.resource-link{justify-content:space-between}}
.visual{display:block;margin:18px 0 8px;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}.visual img{display:block;width:100%;height:auto;pointer-events:none}.visual figcaption{display:block;padding:8px 12px;color:var(--muted);background:#fffdf8;font-size:.75rem;text-align:left}.hero-visual{box-shadow:0 10px 28px rgba(65,49,32,.1)}.card-body .visual{margin-top:0}
</style>
</head>
<body>
<main class="page">
  <header class="hero"><div class="label" id="label"></div><h1 id="title"></h1><p class="lead" id="lead"></p><div id="heroImage"></div></header>
  <section class="note" id="noteBlock" hidden><p id="note"></p></section>
  <section class="cards" id="cards" aria-label="アドバイスサマリー"></section>
  <section class="resources" id="resources" hidden><h2 id="resourcesTitle"></h2><div class="resource-links" id="resourceLinks"></div></section>
  <footer class="footer"><p><strong id="footer"></strong></p></footer>
</main>
<script>
const data={"shareId":"side-sleep-pillow-neck-scapula-8e4c2a71","label":"BODYWORK ADVICE｜首・肩と眠り","title":"横向き寝の高さを選び、左の首〜肩をゆるめる","lead":"横向きで首が傾きすぎない寝床をつくり、左の首から肩甲骨上を気持ちよく伸ばします。寝る向きの偏りも、ベッドの使い方から小さく変えて比べてみます。","heroImage":{"src":"pillow-height-towels.png","alt":"横向き寝で枕が低い場合、高い場合、タオルで首がすっと座る高さへ調整した場合の比較図","caption":"横向きでは肩幅の分だけ、仰向けとは違う高さが必要になります。タオルで少しずつ選べる形にします。"},"note":"今回のテーマは、左の首〜肩甲骨上の筋肉の緊張をゆるめることと、横向き寝の環境をその日の身体に合わせて選べるようにすることです。","footer":"毎晩同じ方法に固定せず、その日の寝やすさ、起きた時の左首〜肩、左右それぞれの向きやすさを比べ、合う方法だけ残していきます。","resourcesTitle":"体操図鑑で動きを確認","resources":[],"cards":[{"id":1,"section":"横向き寝の工夫","mark":"寝1","tag":"高さを選べる枕元","color":"#C08B3E","title":"タオル2〜3枚とクッションを、枕元に用意する","summary":"仰向け用の枕だけで横向きになると、肩幅の分だけ頭が下がりやすくなります。買い替える前に、折ったタオルや小さなクッションで高さを足して比べます。","image":null,"flow":["横向きになる","高さを1枚足す","首の座りを比べる","合う高さを残す"],"points":["折り方を変えられるタオルを2〜3枚、枕の近くに置いておきます。","夜中でも取りやすい位置に置き、その時の寝方に合わせて使い分けます。"],"tip":"高さの正解を決めるより、横向きになった時に首が左右へ折れず、『すっと座る』高さをその日に選びます。"},{"id":2,"section":"横向き寝の工夫","mark":"寝2","tag":"ベッドの向きを使う","color":"#238E9A","title":"枕を反対側へ置き、寝る左右を変えてみる","summary":"壁へ向いて寝ると落ち着く習慣をそのまま使い、枕をベッドの反対側へ移します。壁との位置関係が変わることで、いつもと反対側を上にして寝やすくなるかを試します。","image":null,"flow":["いつもの頭位置","枕を反対へ","壁に向いて横になる","左右を比較"],"points":["いつもの寝方で、どちら側を上にしている時間が多そうかを確認します。","枕を足元側へ移し、頭と足の位置を反対にして寝てみます。","壁へ向く落ち着きは保ったまま、反対側を上にして横向きになりやすいかを比べます。","翌朝の首と肩の感じも含め、続けたい方を選びます。"],"tip":"左右を均等にすることを目標にせず、同じ側だけに固定されにくい環境になるかを観察します。"},{"id":3,"section":"首〜肩甲骨の復習","mark":"体1","tag":"左肩甲挙筋周辺","color":"#A7C91B","title":"左手を後ろへ回し、首を前から右へ傾ける","summary":"左腕を背中側へ置いて左肩を落ち着かせ、首を軽く前へ傾けてから右へ。左の首から肩甲骨上に、気持ちよい伸びが続く位置を探します。","image":{"src":"left-neck-scapula-stretch.png","alt":"左手を背中側に置き、首を軽く前へ傾けてから右へ傾ける二段階のストレッチ図","caption":"右手は引っぱるためではなく、動く方向をそっと案内するために添えます。"},"flow":["左手を後ろへ","首を軽く前へ","そこから右へ","右手をそっと添える"],"points":["座った姿勢で、左手を背中側へ回します。","まず首を軽く前へ傾け、うなじが長くなる方向を作ります。","その位置から頭を右へ傾け、左の首から肩甲骨上の伸びを探します。","右手は頭へ軽く添え、強く引かずに方向だけを案内します。","伸びを大きくしようとせず、気持ちよい範囲で戻ります。"],"tip":"この体操は深さを競いません。左首〜肩甲骨上に心地よい伸びが入る所を見つけたら、そこで十分です。"}],"source":"summary-inbox/side-sleep-pillow-neck-scapula-8e4c2a71.json"};
document.getElementById("label").textContent=data.label;
document.getElementById("title").textContent=data.title;
document.getElementById("lead").textContent=data.lead;
if(data.note){
  document.getElementById("note").textContent=data.note;
  document.getElementById("noteBlock").hidden=false;
}
document.getElementById("footer").textContent=data.footer;
const cards=document.getElementById("cards");
const el=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node};
const visual=(image,className="")=>{
  const figure=el("figure",("visual "+className).trim());
  const img=el("img");img.src=image.src;img.alt=image.alt;img.loading="lazy";img.decoding="async";figure.append(img);
  if(image.caption)figure.append(el("figcaption","",image.caption));
  return figure;
};
if(data.heroImage)document.getElementById("heroImage").append(visual(data.heroImage,"hero-visual"));
if(data.resources.length){
  const resources=document.getElementById("resources");
  const resourceLinks=document.getElementById("resourceLinks");
  document.getElementById("resourcesTitle").textContent=data.resourcesTitle;
  data.resources.forEach(resource=>{
    const link=el("a","resource-link",resource.label);
    link.href=resource.href;
    link.target="_blank";
    link.rel="noopener noreferrer";
    resourceLinks.append(link);
  });
  resources.hidden=false;
}
let currentSection="";
data.cards.forEach((card,index)=>{
  if(card.section&&card.section!==currentSection){
    cards.append(el("div","section-title",card.section));
    currentSection=card.section;
  }
  const button=el("button","card");
  button.type="button";
  button.style.setProperty("--color",card.color);
  button.setAttribute("aria-expanded",String(index===0));
  const head=el("span","card-head");
  head.append(el("span","mark",card.mark));
  const heading=el("span");
  heading.append(el("span","tag",card.tag),el("h2","",card.title));
  head.append(heading,el("span","arrow","▼"));
  const body=el("span","card-body");
  if(card.image)body.append(visual(card.image));
  body.append(el("p","summary",card.summary));
  if(card.flow.length){
    const flow=el("span","flow");
    card.flow.forEach((item,flowIndex)=>{
      if(flowIndex)flow.append(el("span","flow-arrow","→"));
      flow.append(el("span","chip",item));
    });
    body.append(flow);
  }
  const points=el("span","points");
  card.points.forEach((item,pointIndex)=>{
    const point=el("span","point");
    point.append(el("span","num",String(pointIndex+1)),el("p","",item));
    points.append(point);
  });
  const tip=el("span","tip");
  tip.append(el("strong","","扱い方"),el("p","",card.tip));
  body.append(points,tip);
  button.append(head,body);
  button.addEventListener("click",()=>button.setAttribute("aria-expanded",String(button.getAttribute("aria-expanded")!=="true")));
  cards.append(button);
});
</script>
</body>
</html>
