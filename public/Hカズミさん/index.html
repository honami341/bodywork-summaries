<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Bodyworkの個別セッション記録一覧" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#f7f4ee" />
  <title>セッション記録</title>
  <style>
    :root{--paper:#f7f4ee;--panel:#fffdf8;--ink:#2e2a25;--muted:#766d63;--line:#ded5c9;--amber:#c98a3d;--amber-dark:#80531d;--soft:#f3e4cc;--shadow:0 14px 34px rgba(65,49,32,.08)}
    *{box-sizing:border-box}
    html{background:var(--paper)}
    body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 0%,rgba(201,138,61,.16),transparent 28rem),var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;line-height:1.8}
    main{width:min(760px,calc(100% - 28px));margin:0 auto;padding:34px 0 72px}
    .eyebrow{display:flex;align-items:center;gap:9px;margin:0 0 12px;color:var(--amber);font-size:.76rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}
    .eyebrow::before{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 6px rgba(201,138,61,.12);content:""}
    h1{margin:0;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(1.9rem,7vw,3rem);line-height:1.32}
    .lead{margin:14px 0 27px;color:var(--muted)}
    .record{display:block;padding:19px;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--ink);text-decoration:none;box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease}
    .record:hover{transform:translateY(-2px);border-color:rgba(201,138,61,.7)}
    .record:focus-visible,.back:focus-visible{outline:3px solid rgba(201,138,61,.28);outline-offset:3px}
    .meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
    .meta span{padding:5px 9px;border-radius:999px;background:var(--soft);color:#6e4a1e;font-size:.72rem;font-weight:800}
    h2{margin:0;font-size:1.08rem;line-height:1.5}
    .record p{margin:7px 0 0;color:var(--muted);font-size:.86rem}
    .arrow{display:inline-flex;margin-top:13px;color:var(--amber-dark);font-size:.82rem;font-weight:850}
    .note{margin-top:22px;padding:13px 15px;border-left:4px solid var(--amber);border-radius:0 14px 14px 0;background:rgba(255,253,248,.82);color:#5d544a;font-size:.8rem}
    .back{display:inline-flex;margin-top:21px;color:var(--amber-dark);font-size:.82rem;font-weight:850;text-decoration:none}
    footer{margin-top:30px;color:var(--muted);font-size:.72rem;text-align:center}
    @media(prefers-reduced-motion:reduce){.record{transition:none}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Bodywork Records</p>
    <h1>セッション記録</h1>
    <p class="lead">セッションごとの要点と、家で確認する動きをまとめています。</p>

    <a class="record" href="./session-01/">
      <div class="meta"><span>SESSION 01</span><span>ターン</span><span>胸郭と腕</span></div>
      <h2>回りすぎを止めるために、胴体から腕を動かす</h2>
      <p>下半身をアンカーにし、胸郭・肘・腕の順番を整えるアドバイスサマリー。</p>
      <span class="arrow">サマリーを開く →</span>
    </a>

    <div class="note">公開画面には個人名や未加工の文字起こしを表示していません。このページは検索エンジン向けに noindex を指定しています。</div>
    <a class="back" href="../">← Summary Libraryへ戻る</a>
    <footer>Bodywork Session Records</footer>
  </main>
</body>
</html>
